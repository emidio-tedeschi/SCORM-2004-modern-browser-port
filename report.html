<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>SCORM • Report dei test</title>
<style>body{font:16px/1.6 system-ui;max-width:1100px;margin:40px auto;padding:0 22px;color:#172b3b;background:#f5f8fa}h1{letter-spacing:-.04em}table{border-collapse:collapse;width:100%;background:white}td,th{text-align:left;padding:10px;border-bottom:1px solid #dde4e9}input,button{font:inherit;margin:12px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}.FAIL,.BLOCKED{color:#a32132}.PASS{color:#15714c}.REVIEW,.INCOMPLETE{color:#845509}</style>
<h1>Report SCORM 2004</h1><p>Apri i JSON esportati dai corsi. Elaborazione locale: nessun caricamento su un servizio esterno. I report riguardano questo porting sperimentale e non attestano la conformità dell'intero LMS.</p><input type="file" id="files" accept=".json,application/json" multiple><p id="message" role="status"></p><table><thead><tr><th>Pacchetto / sessione</th><th>Esito</th><th>Visite</th><th>FAIL</th><th>REVIEW</th><th>BLOCKED</th></tr></thead><tbody id="rows"></tbody></table><div id="details"></div>
<script>
const loaded=new Map();document.getElementById('files').onchange=async event=>{for(const f of event.target.files){try{const d=JSON.parse(await f.text());if(d.schema!=='adl-modern-report/1'||!Array.isArray(d.rows)||!d.summary)throw Error('Formato non valido');loaded.set(d.sourceCommit+'|'+d.package+'|'+d.config.run+'|'+d.config.learnerId,d);}catch(e){document.getElementById('message').textContent=f.name+': '+e;}}
const rows=document.getElementById('rows'),details=document.getElementById('details');rows.replaceChildren();details.replaceChildren();for(const d of loaded.values()){const c={PASS:0,FAIL:0,REVIEW:0,BLOCKED:0};for(const r of d.rows)c[r.status]=(c[r.status]||0)+1;const total=d.summary.totalVisits;const status=c.BLOCKED?'BLOCKED':c.FAIL?'FAIL':d.cursor<total?'INCOMPLETE':c.REVIEW?'REVIEW':'PASS';const tr=document.createElement('tr');for(const val of [d.package+' / '+d.config.run,status,d.cursor+'/'+total,c.FAIL,c.REVIEW,c.BLOCKED]){const td=document.createElement('td');td.textContent=val;tr.append(td);}tr.className=status;rows.append(tr);const item=document.createElement('details'),summary=document.createElement('summary'),pre=document.createElement('pre');summary.textContent=d.package+' — errori e verifiche aperte';pre.textContent=JSON.stringify(d.rows.filter(r=>['FAIL','REVIEW','BLOCKED'].includes(r.status)),null,2);item.append(summary,pre);details.append(item);}};
</script></html>
